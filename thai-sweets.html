// ---------- audio ----------
let ac = null, muted = false;
function tone(f, d, type = 'sine', v = 0.12, sl = 0, delay = 0) {
  if (muted || !ac) return;
  const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (sl) o.frequency.exponentialRampToValueAtTime(f * sl, t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + d);
}
const sfx = {
  swap: () => tone(300, 0.09, 'triangle', 0.1, 1.5),
  bad: () => tone(160, 0.16, 'square', 0.06, 0.7),

  special: () => { tone(180, 0.45, 'sawtooth', 0.08, 3); tone(700, 0.3, 'triangle', 0.1, 2, 0.05); },
  win: () => [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.3, 'triangle', 0.13, 1, i * 0.12)),
  lose: () => [392, 330, 262].forEach((f, i) => tone(f, 0.3, 'triangle', 0.1, 1, i * 0.15)),
  click: () => tone(660, 0.07, 'triangle', 0.08)

// ---------- helpers ----------
const rand = n => Math.floor(Math.random() * n);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const frame = () => new Promise(r => requestAnimationFrame(r));
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function txt(t, x, y, size, color, align = 'center', stroke) {
  ctx.font = `700 ${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  if (stroke) { ctx.lineWidth = size / 6; ctx.strokeStyle = stroke; ctx.lineJoin = 'round'; ctx.strokeText(t, x, y); }
  ctx.fillStyle = color; ctx.fillText(t, x, y);
}
function rg(x0, y0, r0, x1, y1, r1, stops) {
  const g = ctx.createRadialGradient(x0, y0, r0, x1, y1, r1);
  stops.forEach((c, i) => g.addColorStop(i / (stops.length - 1), c)); return g;
}
function lgrad(x0, y0, x1, y1, stops) {
  const g = ctx.createLinearGradient(x0, y0, x1, y1);
  stops.forEach((c, i) => g.addColorStop(i / (stops.length - 1), c)); return g;
}

];
let K = null;
try { document.fonts.load('700 20px Kanit').then(() => wrapCache.clear()); } catch (e) {}
const wrapCache = new Map();
function wrapLines(t, maxW, size) {
  const key = t + '|' + maxW + '|' + size; if (wrapCache.has(key)) return wrapCache.get(key);
  ctx.font = `700 ${size}px ${FONT}`;
  const segs = (window.Intl && Intl.Segmenter) ? [...new Intl.Segmenter('th', { granularity: 'word' }).segment(t)].map(s => s.segment) : [...t];
  const lines = []; let cur = '';
  for (const s of segs) {
    if (cur && ctx.measureText(cur + s).width > maxW) { lines.push(cur.trim()); cur = s.trimStart(); } else cur += s;
  }
  if (cur.trim()) lines.push(cur.trim());
  wrapCache.set(key, lines); return lines;
}
function para(t, x, y, maxW, lh, size, color, align = 'center') {
  const lines = wrapLines(t, maxW, size);
  lines.forEach((l, i) => txt(l, x, y + i * lh, size, color, align));
  return y + lines.length * lh;
}
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = rand(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function openLearn(L) {
  const idx = (L - 1) % CARDS.length;
  if (!save.cards.includes(idx)) save.cards.push(idx);
  const pool = shuffle(save.cards.filter(i => i !== idx));
  K = { step: 'card', idx, qs: [idx, ...pool.slice(0, 2)], i: 0, picked: -1, correct: 0, order: null, from: 'level', L };
  persist(); mode = 'learn'; overlay = null;
}
function openQuestion() { K.step = 'quiz'; K.picked = -1; K.order = shuffle([0, 1, 2]); }
function panel(y, h) {
  ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 24;
  rr(30, y, 420, h, 28); ctx.fillStyle = lgrad(0, y, 0, y + h, ['#fff3d1', '#f1d595']); ctx.fill(); ctx.restore();
  rr(30, y, 420, h, 28); ctx.strokeStyle = '#c8861f'; ctx.lineWidth = 5; ctx.stroke();
}
function drawLearn() {
  const INK = '#4a2a10';
  if (K.step === 'card') {
    const card = CARDS[K.idx]; panel(60, 600);
    txt('การ์ดความรู้ #' + (K.idx + 1), W / 2, 100, 18, '#8a4b00');
    ctx.save(); ctx.translate(W / 2, 185 + Math.sin(now / 400) * 5); drawPiece(card.icon, 46); ctx.restore();
    txt(card.title, W / 2, 280, 38, '#5a2c00');
    let y = para(card.text, W / 2, 335, 370, 32, 21, INK) + 4;
    if (card.refs && card.refs.length) {
      txt('อ้างอิง (แตะเพื่อเปิด)', W / 2, y, 13, '#8a5a20'); y += 22;
      card.refs.forEach(r => {
        txt('🔗 ' + r.t, W / 2, y, 14, '#a04a00');
        buttons.push({ x: 50, y: y - 11, w: 380, h: 22, fn: () => openLink(r.u) }); y += 22;
      });
    } else txt('ข้อมูลทั่วไป ควรตรวจสอบกับแหล่งอ้างอิงเพิ่มเติม', W / 2, y, 13, '#8a5a20');
    if (K.from === 'book') button('กลับ', 150, 598, 180, 52, () => { sfx.click(); mode = 'book'; }, '#7fd6ff');
    else button('ไปทำควิซ', 130, 598, 220, 52, () => { sfx.click(); openQuestion(); });
  } else if (K.step === 'quiz') {
    const card = CARDS[K.qs[K.i]]; panel(60, 640);
    txt('ควิซ ข้อ ' + (K.i + 1) + ' / ' + K.qs.length, W / 2, 100, 20, '#8a4b00');
    para(card.q, W / 2, 175, 360, 38, 26, INK);
    card.c.forEach((_, k) => {
      const orig = K.order[k], y = 290 + k * 84, done = K.picked >= 0;
      let fill = ['#fff', '#ffe9b8'];
      if (done && orig === card.a) fill = ['#b8f5a0', '#6fd26b']; else if (done && K.picked === k) fill = ['#ffc2c2', '#ff7a7a'];
      buttons.push({ x: 60, y, w: 360, h: 68, fn: () => {
        if (K.picked >= 0) return; K.picked = k;
        if (K.order[k] === card.a) { K.correct++; sfx.pop(4); } else sfx.bad();
      } });
      rr(60, y, 360, 68, 20); ctx.fillStyle = lgrad(0, y, 0, y + 68, fill); ctx.fill();
      ctx.strokeStyle = '#c8861f'; ctx.lineWidth = 3; ctx.stroke();
      para(card.c[orig], W / 2, y + 34, 330, 22, 20, INK);
    });
    if (K.picked >= 0) {
      const ok = K.order[K.picked] === card.a;
      txt(ok ? 'ถูกต้อง! เก่งมาก' : 'ยังไม่ถูก ไม่เป็นไรนะ', W / 2, 570, 26, ok ? '#2f8a2a' : '#c0392b');
      button(K.i + 1 < K.qs.length ? 'ข้อต่อไป' : 'ดูผล', 130, 610, 220, 52, () => {
        sfx.click(); K.i++;
        if (K.i >= K.qs.length) { K.step = 'result'; save.kp += K.correct; persist(); sfx.win(); popHooks(); } else openQuestion();
      });
    }
  } else {
    panel(100, 560);
    txt('สรุปผลควิซ', W / 2, 160, 36, '#5a2c00');
    txt(K.correct + ' / ' + K.qs.length, W / 2, 250, 80, '#d2760a');
    txt('ได้แต้มความรู้ +' + K.correct, W / 2, 330, 26, INK);
    txt('แต้มความรู้สะสม ' + save.kp, W / 2, 368, 20, '#8a4b00');
    para('เก็บการ์ดใบใหม่ไว้ใน "สมุดความรู้" แล้ว', W / 2, 420, 360, 28, 20, INK);
    if (K.L < LEVEL_COUNT) button('ด่านต่อไป', 130, 480, 220, 56, () => { sfx.click(); startLevel(K.L + 1); });
    button('เลือกด่าน', 150, 552, 180, 48, () => { sfx.click(); mode = 'map'; }, '#7fd6ff');
  }
}
function drawBook() {
  txt('สมุดความรู้', W / 2, 66, 44, '#ffe27a', 'center', '#4a1a00');
  txt('แต้มความรู้ ' + save.kp + '  ·  การ์ด ' + save.cards.length + '/' + CARDS.length, W / 2, 108, 18, '#e8fff8');

// ---------- match logic ----------
function findMatches(hintCells) {

  const setCreate = (k, s) => { if (!create.has(k) || prio[s] > prio[create.get(k)]) create.set(k, s); };
  const hCells = new Set(), vCells = new Set();
  const runs = [];
  for (let r = 0; r < N; r++) for (let c = 0; c < N;) {
    const t = grid[r][c]; if (!t || t.type < 0 || t.dying) { c++; continue; }
    let e = c; while (e + 1 < N && grid[r][e + 1] && !grid[r][e + 1].dying && grid[r][e + 1].type === t.type) e++;
    if (e - c >= 2) { const cells = []; for (let i = c; i <= e; i++) { cells.push(key(r, i)); hCells.add(key(r, i)); } runs.push({ cells, dir: 'row' }); }

    let e = r; while (e + 1 < N && grid[e + 1][c] && !grid[e + 1][c].dying && grid[e + 1][c].type === t.type) e++;
    if (e - r >= 2) { const cells = []; for (let i = r; i <= e; i++) { cells.push(key(i, c)); vCells.add(key(i, c)); } runs.push({ cells, dir: 'col' }); }
    r = e + 1;

    } else m.create.delete(k);
    const clearCells = new Set([...ex.cells].filter(k => !m.create.has(k)));
    await clearSet(clearCells, cascade);
    await gravity();
  }
}
async function trySwap(a, b) {
  if (busy || mode !== 'play' || overlay) return;
  busy = true; selected = null; hint = null;
  const A = grid[a.r][a.c], B = grid[b.r][b.c];
  grid[a.r][a.c] = B; grid[b.r][b.c] = A; sfx.swap();
  await settle();
  let did = false;
  const specials = [];
  if (A.special) specials.push([b, A, B]); if (B.special) specials.push([a, B, A]);
  if (specials.length) {
    did = true; const set = new Set();
    for (const [pos, sp, other] of specials) {
      if (sp.special === 'bomb') sp.target = (other.special === 'bomb') ? 'all' : other.type;
      set.add(pos.r * N + pos.c);
    }
    const ex = expand(set); sfx.special(); shake = 14;
    await clearSet(ex.cells, 1); await gravity(); await resolve([]);
  } else if (findMatches([a, b]).clear.size) {
    did = true; await resolve([a, b]);
  } else {
    sfx.bad(); grid[a.r][a.c] = A; grid[b.r][b.c] = B; await settle();
  }
  if (did) {
    S.moves--;
    if (checkEnd()) { busy = false; return; }
    if (!findMove()) { toast = { t: 'สับกระดาน', life: 70 }; fillBoard(); await settle(); }
  }
  busy = false; lastMove = performance.now();
}
function goalsMet() { return S.score >= S.def.score && Object.values(S.collect).every(v => v <= 0); }
function checkEnd() {
  if (goalsMet()) {
    const ratio = S.moves / S.def.moves, stars = ratio >= 0.5 ? 3 : ratio >= 0.25 ? 2 : 1;
    S.score += S.moves * 50;
    save.stars[S.L] = Math.max(save.stars[S.L] || 0, stars);
    save.unlocked = Math.max(save.unlocked, Math.min(LEVEL_COUNT, S.L + 1)); persist(); popHooks();
    overlay = { kind: 'win', stars, t: now }; sfx.win(); return true;
  }
  if (S.moves <= 0) { overlay = { kind: 'lose', t: now }; sfx.lose(); return true; }
  return false;
}

// ---------- per-frame update ----------
function update() {
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    const t = grid[r] && grid[r][c]; if (!t) continue;
    const tx = c * T, ty = r * T;
    t.x += (tx - t.x) * 0.35; if (Math.abs(tx - t.x) < 0.5) t.x = tx;
    const dy = ty - t.y;
    if (t.fall && dy > 0) {
      t.vel += 1.3; t.y += Math.min(dy, t.vel);
      if (t.y >= ty - 0.01) { t.y = ty; t.fall = false; t.vel = 0; t.sq = 0.8; }
    } else { t.fall = false; t.y += dy * 0.35; if (Math.abs(dy) < 0.5) t.y = ty; }
    if (t.sq > 0) t.sq = Math.max(0, t.sq - 0.07);
    if (t.dying) t.scale = Math.max(0, t.scale - 0.09);
  }
  for (const p of particles) { p.x += p.vx; p.y += p.vy; if (!p.text) p.vy += 0.15; p.life--; }
  particles = particles.filter(p => p.life > 0);
  shake *= 0.88; if (shake < 0.3) shake = 0;
  if (toast && --toast.life <= 0) toast = null;
  if (mode === 'play' && !busy && !overlay && !hint && now - lastMove > 5000) hint = findMove();
  if (S) S.shown += (S.score - S.shown) * 0.15;
}

// ---------- drawing ----------
function button(label, x, y, w, h, fn, color = '#ffb81f') {
  buttons.push({ x, y, w, h, fn });
  ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.4)'; ctx.shadowBlur = 10; ctx.shadowOffsetY = 4;
  rr(x, y, w, h, h / 2); ctx.fillStyle = lgrad(0, y, 0, y + h, ['#ffe27a', color, '#d27d00']); ctx.fill(); ctx.restore();
  rr(x, y, w, h, h / 2); ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 2; ctx.stroke();
  txt(label, x + w / 2, y + h / 2 + 1, h * .48, '#5a2c00');
}
function iconBtn(label, x, y, s, fn) {
  buttons.push({ x, y, w: s, h: s, fn });
  ctx.beginPath(); ctx.arc(x + s / 2, y + s / 2, s / 2, 0, 7); ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fill();
  ctx.strokeStyle = 'rgba(255,215,120,.8)'; ctx.lineWidth = 2; ctx.stroke();
  txt(label, x + s / 2, y + s / 2 + 1, s * .5, '#fff');
}
function drawTile(t, cx, cy, off = 0) {
  ctx.save(); ctx.translate(cx, cy + off);
  const sq = t.sq || 0; ctx.scale((1 + 0.14 * sq) * t.scale, (1 - 0.14 * sq) * t.scale);
  ctx.globalAlpha = Math.min(1, t.scale * 1.4);
  if (t.special) { ctx.shadowColor = '#fff'; ctx.shadowBlur = 12 + 6 * Math.sin(now / 200); }
  if (t.type < 0) drawBomb(22, now); else drawPiece(t.type, 22);
  ctx.shadowBlur = 0;
  if (t.special && t.type >= 0) drawSpecialMark(t.special, 22, now);
  ctx.restore();
}
function drawBoard() {
  const sx = shake ? (Math.random() - .5) * shake : 0, sy = shake ? (Math.random() - .5) * shake : 0;
  ctx.save(); ctx.translate(sx, sy);
  ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 24;
  rr(BX - 12, BY - 12, N * T + 24, N * T + 24, 22); ctx.fillStyle = lgrad(0, BY, 0, BY + N * T, ['#ffe27a', '#d9961b', '#8a560a']); ctx.fill(); ctx.restore();
  rr(BX - 6, BY - 6, N * T + 12, N * T + 12, 16); ctx.fillStyle = '#1b1238'; ctx.fill();
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    rr(BX + c * T + 2, BY + r * T + 2, T - 4, T - 4, 10);
    ctx.fillStyle = (r + c) % 2 ? 'rgba(255,255,255,.07)' : 'rgba(255,255,255,.12)'; ctx.fill();
  }
  ctx.save(); rr(BX - 6, BY - 6, N * T + 12, N * T + 12, 16); ctx.clip();
  const hs = hint ? hint.map(h => h.r * N + h.c) : [];
  if (GL) {
    renderBoard3D(hs);
    ctx.drawImage(GL.renderer.domElement, BX, BY, N * T, N * T);
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      const t = grid[r][c]; if (!t || !t.special || t.type < 0) continue;
      ctx.save(); ctx.translate(BX + t.x + T / 2, BY + t.y + T / 2); ctx.scale(t.scale, t.scale);
      ctx.shadowColor = '#fff'; ctx.shadowBlur = 10 + 6 * Math.sin(now / 200);
      drawSpecialMark(t.special, 22, now); ctx.restore();
    }
  } else for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    const t = grid[r][c]; if (!t) continue;
    const off = hs.includes(r * N + c) ? Math.sin(now / 120) * 4 : 0;
    drawTile(t, BX + t.x + T / 2, BY + t.y + T / 2, off);
  }
  if (selected) {
    const [x, y] = cellCenter(selected.r, selected.c);
    rr(x - T / 2 + 2, y - T / 2 + 2, T - 4, T - 4, 10); ctx.strokeStyle = `rgba(255,255,255,${.7 + .3 * Math.sin(now / 120)})`; ctx.lineWidth = 3; ctx.stroke();
  }
  ctx.restore(); ctx.restore();
}
function drawHUD() {
  txt('ด่าน ' + S.L, W / 2, 34, 26, '#ffe27a', 'center', '#3a1a00');
  iconBtn('☰', 14, 14, 40, () => { sfx.click(); mode = 'map'; });
  iconBtn(muted ? '🔇' : '🔊', W - 54, 14, 40, () => { muted = !muted; });
  // score bar
  const bx = 24, by = 70, bw = 300;
  txt('คะแนน', bx, by - 4, 14, '#cfe', 'left');
  txt(Math.round(S.shown) + ' / ' + S.def.score, bx + bw, by - 4, 14, '#fff', 'right');
  rr(bx, by + 8, bw, 16, 8); ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.fill();
  const p = Math.min(1, S.shown / S.def.score);
  if (p > 0.01) { rr(bx, by + 8, Math.max(16, bw * p), 16, 8); ctx.fillStyle = lgrad(0, by, bw, by, ['#ff8a2a', '#ffe14d']); ctx.fill(); }
  rr(bx, by + 8, bw, 16, 8); ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 1.5; ctx.stroke();
  [1, 2, 3].forEach(i => txt('★', bx + bw * (i / 3) - 8, by + 16, 14, '#ffe27a'));
  // moves
  ctx.beginPath(); ctx.arc(W - 62, 100, 40, 0, 7); ctx.fillStyle = rg(W - 70, 88, 4, W - 62, 100, 40, ['#ff9bd0', '#c2185b']); ctx.fill();
  ctx.strokeStyle = '#ffe27a'; ctx.lineWidth = 3; ctx.stroke();
  txt(String(S.moves), W - 62, 98, 34, '#fff'); txt('ตาเดิน', W - 62, 122, 12, '#ffe');
  // collect goals
  const ids = Object.keys(S.collect);
  ids.forEach((id, i) => {
    const gx = 40 + i * 120, gy = 175;
    rr(gx - 28, gy - 30, 112, 60, 16); ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fill();
    ctx.save(); ctx.translate(gx, gy); drawPiece(+id, 18); ctx.restore();
    const left = Math.max(0, S.collect[id]);
    if (left === 0) txt('✓', gx + 52, gy, 26, '#8fe36a'); else txt('× ' + left, gx + 52, gy, 22, '#fff');
  });
  if (!ids.length) txt('ทำคะแนนให้ถึงเป้า!', W / 2 - 40, 175, 20, '#ffe');
  const card = CARDS[(S.L - 1) % CARDS.length];
  txt('รู้หรือไม่? · ' + card.title, W / 2, 710, 13, '#ffe27a');
  para(card.text, W / 2, 728, 430, 16, 12, '#e8fff8');
}
function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life / p.max);
    if (p.text) txt(p.text, p.x, p.y, p.size, p.color, 'center', '#3a1a00');
    else { ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.size * ctx.globalAlpha + .5, 0, 7); ctx.fill(); }
  }
  ctx.globalAlpha = 1;
  if (toast && toast.t) {
    const k = toast.life / 55, sc = 1 + (1 - Math.min(1, k * 3)) * 0;
    ctx.globalAlpha = Math.min(1, k * 2); ctx.save(); ctx.translate(W / 2, BY + N * T / 2); ctx.scale(sc * (1.3 - 0.3 * k), sc * (1.3 - 0.3 * k));
    txt(toast.t, 0, 0, 56, '#fff3a0', 'center', '#7a2a00'); ctx.restore(); ctx.globalAlpha = 1;
  }
}
function drawBg() {
  ctx.drawImage(bg, 0, 0, W, H);
  for (const p of petals) {
    p.y += p.v; p.x += Math.sin(now / 900 + p.p) * 0.4; if (p.y > H + 20) { p.y = -20; p.x = Math.random() * W; }
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(now / 1200 + p.p); ctx.globalAlpha = .35; drawPiece(p.t, p.s); ctx.restore();
  }
}
function drawTitle() {
  txt('ขนมไทย', W / 2, 190, 76, '#ffe27a', 'center', '#4a1a00');
  txt('ป๊อป!', W / 2, 270, 84, '#ff8fc0', 'center', '#4a0a30');
  if (GL) txt('3D', W / 2 + 128, 236, 34, '#7fd6ff', 'center', '#0a2a4a');
  for (let i = 0; i < 6; i++) {
    ctx.save(); ctx.translate(60 + i * 72, 380 + Math.sin(now / 400 + i) * 12); ctx.rotate(Math.sin(now / 700 + i) * .2); drawPiece(i, 28); ctx.restore();
  }
  txt('จับคู่ขนมไทย 3 ชิ้นขึ้นไป', W / 2, 460, 20, '#e8fff8');
  button(save.unlocked > 1 ? 'เล่นต่อ' : 'เริ่มเล่น', 120, 520, 240, 64, () => { sfx.click(); startLevel(Math.min(save.unlocked, LEVEL_COUNT)); });
  button('เลือกด่าน', 140, 600, 200, 52, () => { sfx.click(); mode = 'map'; }, '#7fd6ff');
  button('สมุดความรู้', 140, 666, 200, 52, () => { sfx.click(); mode = 'book'; }, '#ffb3d9');
}
function drawMap() {
  txt('เลือกด่าน', W / 2, 90, 44, '#ffe27a', 'center', '#4a1a00');
  for (let i = 0; i < LEVEL_COUNT; i++) {
    const L = i + 1, x = 30 + (i % 4) * 108, y = 150 + Math.floor(i / 4) * 118, open = L <= save.unlocked;
    buttons.push({ x, y, w: 100, h: 100, fn: () => open && (sfx.click(), startLevel(L)) });
    rr(x, y, 100, 100, 22); ctx.fillStyle = open ? lgrad(0, y, 0, y + 100, ['#ffe27a', '#ffa41f']) : 'rgba(0,0,0,.4)'; ctx.fill();
    ctx.strokeStyle = open ? '#fff' : 'rgba(255,255,255,.2)'; ctx.lineWidth = 2; ctx.stroke();
    txt(open ? String(L) : '🔒', x + 50, y + 42, open ? 44 : 34, open ? '#5a2c00' : '#fff');
    if (open) txt('★'.repeat(save.stars[L] || 0) + '☆'.repeat(3 - (save.stars[L] || 0)), x + 50, y + 82, 18, '#8a3d00');
  }
  txt('แต้มความรู้ ' + save.kp, W / 2, 128, 18, '#e8fff8');
  button('สมุดความรู้', 50, 660, 190, 52, () => { sfx.click(); mode = 'book'; }, '#ffb3d9');
  button('กลับ', 260, 660, 170, 52, () => { sfx.click(); mode = 'title'; }, '#7fd6ff');
}
function drawOverlay() {
  buttons = [];
  ctx.fillStyle = 'rgba(10,0,30,.7)'; ctx.fillRect(0, 0, W, H);
  const k = Math.min(1, (now - overlay.t) / 300), e = 1 - Math.pow(1 - k, 3);
  ctx.save(); ctx.translate(W / 2, H / 2 - 20); ctx.scale(e, e);
  rr(-190, -200, 380, 400, 30); ctx.fillStyle = lgrad(0, -200, 0, 200, ['#4a2a86', '#2a1458']); ctx.fill();
  ctx.strokeStyle = '#ffd36a'; ctx.lineWidth = 5; ctx.stroke();
  if (overlay.kind === 'win') {
    txt('ผ่านด่าน!', 0, -140, 56, '#ffe27a', 'center', '#4a1a00');
    for (let i = 0; i < 3; i++) {
      const on = i < overlay.stars, d = Math.max(0, Math.min(1, (now - overlay.t - 300 - i * 250) / 300));
      txt('★', -70 + i * 70, -60 + (i === 1 ? -10 : 0), (on ? 20 + 54 * d : 64), on ? '#ffd23a' : 'rgba(255,255,255,.2)', 'center', on ? '#7a4a00' : null);
    }
    txt('คะแนน ' + S.score, 0, 10, 28, '#fff');
  } else {
    txt('เสียดายจัง', 0, -130, 52, '#ff9bb0', 'center', '#400020');
    txt('ลองใหม่อีกครั้งนะ', 0, -60, 24, '#fff');
    txt('คะแนน ' + S.score + ' / ' + S.def.score, 0, 0, 24, '#ffe');
  }
  ctx.restore();
  const oy = H / 2 - 20, os = e;
  if (os > .95) {
    if (overlay.kind === 'win') button('รับการ์ดความรู้', 130, oy + 40, 220, 56, () => { sfx.click(); openLearn(S.L); });
    button('เล่นอีกครั้ง', 130, oy + (overlay.kind === 'win' ? 110 : 50), 220, 52, () => { sfx.click(); startLevel(S.L); }, '#7fd6ff');
    button('เลือกด่าน', 150, oy + (overlay.kind === 'win' ? 176 : 116), 180, 44, () => { sfx.click(); mode = 'map'; overlay = null; }, '#c9a0ff');
  }
}
function loop(ts) {
  now = ts || performance.now();
  update();
  buttons = [];
  ctx.clearRect(0, 0, W, H);
  drawBg();
  if (mode === 'title') drawTitle();
  else if (mode === 'map') drawMap();
  else if (mode === 'book') drawBook();
  else if (mode === 'learn' && K) drawLearn();
  else if (mode === 'play' && S) { drawHUD(); drawBoard(); drawParticles(); if (overlay) drawOverlay(); }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
if (window.Hub) { Hub.visit('pop'); Hub.mountMusic(); popHooks(); }

// ---------- input ----------
function pos(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height }; }
function cellAt(p) {
  const c = Math.floor((p.x - BX) / T), r = Math.floor((p.y - BY) / T);
  return (r >= 0 && c >= 0 && r < N && c < N) ? { r, c } : null;
}
cv.addEventListener('pointerdown', e => {
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (err) {} }
  if (ac && ac.state === 'suspended') ac.resume();
  const p = pos(e);
  for (let i = buttons.length - 1; i >= 0; i--) {
    const b = buttons[i];
    if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) { b.fn(); return; }
  }
  if (mode !== 'play' || busy || overlay) return;
  const cell = cellAt(p); if (!cell) { selected = null; return; }
  hint = null; lastMove = performance.now();
  if (selected && Math.abs(selected.r - cell.r) + Math.abs(selected.c - cell.c) === 1) { const a = selected; trySwap(a, cell); drag = null; return; }
  selected = cell; drag = { cell, x: p.x, y: p.y };
});
cv.addEventListener('pointermove', e => {
  if (!drag || busy || overlay) return;
  const p = pos(e), dx = p.x - drag.x, dy = p.y - drag.y;
  if (Math.hypot(dx, dy) < T * 0.4) return;
  const a = drag.cell, b = Math.abs(dx) > Math.abs(dy) ? { r: a.r, c: a.c + Math.sign(dx) } : { r: a.r + Math.sign(dy), c: a.c };
  drag = null;
  if (b.r >= 0 && b.c >= 0 && b.r < N && b.c < N) trySwap(a, b);
});
addEventListener('pointerup', () => { drag = null; });
</script>
